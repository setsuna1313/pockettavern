<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="script-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'; frame-src 'none'">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <title>PocketTavern</title>
  <meta name="description" content="A mobile-first character chat frontend for OpenRouter, OpenAI-compatible APIs and Claude.">
  <meta name="theme-color" content="#14121a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Tavern">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div id="bg1"></div>
  <div id="app"></div>
  <div id="toast" role="status" aria-live="polite"></div>
  <input type="file" id="file-cards" accept=".png,.json,.zip,image/png,application/json,application/zip" multiple hidden>
  <input type="file" id="file-avatar" accept="image/*" hidden>
  <input type="file" id="file-ndb" accept=".json,application/json" hidden>
  <input type="file" id="file-backup" accept=".json,application/json" hidden>
  <input type="file" id="file-chat" hidden>
  <input type="file" id="file-images" accept="image/*" multiple hidden>
  <input type="file" id="file-sprites" accept="image/*" multiple hidden>
  <input type="file" id="file-zip" accept=".zip,application/zip,application/x-zip-compressed" hidden>
  <script type="module" src="js/app.js"></script>
</body>
</html>
